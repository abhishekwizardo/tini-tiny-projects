<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock ! paper ! scissor !</title>

    <link rel="stylesheet" href="style.css">
    <script src="scipt.js" defer ></script>

    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">

</head>
<body>

    <div class = "header">

       <h1>Rock paper Scissors </h1>

    </div>

    <div class="section">

        
        <div class = "box">
            
            <div class="box1">
                
                <h2> The Computer locken in, Lock your Choice! NOW! </h2>
                
            </div>
            
            <div class = "box2">
                
                <button class = "choice" id = "rock">

                    <img height="100px" width="auto" src="images/rock-svgrepo-com.svg" alt="">

                    <br> 
                    
                    ROCK

                </button>
                
                <button class = "choice" id = "paper">
                    
                   <img src="images/page-svgrepo-com.svg" alt="" height="100px" width="auto">

                   <br>

                   PAPER

                </botton>
                
                <button class = "choice" id = "scissor">
                    
                   <img height="100px" width="auto" src="images/scissors-svgrepo-com.svg" alt="">
                    
                   <br>

                   SCISSOR
                    
                </button>
                    

                
            </div>

            <div class = "result"  id = "bot-choice">
                The computer chose.. why tell you. 
            </div>
            
            <div class = "result"  id = "result">
                Lock in!
            </div>

            <div class = "result" id = "your-score"> 
                choose you idiot. 
            </div>

            <div class = "result" id = "bot-score">
                choose you idiot. 
            </div>

            <div class = "result" id = "rounds">
                choose you idiot. 
            </div>


        </div>

        <div class="stat-box">

        </div>
        

    </div>

    <div class="footer">

    </div>

    
    <div class="popup-overlay hidden" id="popup">
        <div class="popup-box">
            <h2 id="popup-title">YOU WIN!</h2>
            <p id="popup-message">The computer has been defeated.</p>
            <button id="next-game">NEXT GAME</button>
        </div>
    </div>

    
</body>
</html>
